<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lightie playground</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #1d1d1f;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f5f5f7;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      p {
        margin: 0 0 16px;
        color: #555;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      button,
      select,
      label.file {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
      }
      .panes {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .pane {
        background: #fff;
        border-radius: 12px;
        padding: 12px;
      }
      .pane h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .view {
        width: 320px;
        height: 320px;
      }
      pre {
        background: #fff;
        border-radius: 12px;
        padding: 12px;
        max-width: 680px;
        white-space: pre-wrap;
        font-size: 12px;
      }
      input[type='file'] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>lightie playground</h1>
    <p>Same animation, two renderers. Block the main thread and watch which one keeps moving.</p>
    <div class="controls">
      <select id="fixture"></select>
      <label class="file">Open Lottie JSON…<input id="file" type="file" accept=".json,application/json" /></label>
      <button id="toggle" type="button">Pause</button>
      <button id="block" type="button">Block main thread for 1.5 s</button>
    </div>
    <div class="panes">
      <div class="pane">
        <h2>lottie-web (SVG renderer)</h2>
        <div id="ref" class="view"></div>
      </div>
      <div class="pane">
        <h2>lightie (compiled to WAAPI)</h2>
        <div id="out" class="view"></div>
      </div>
    </div>
    <pre id="report"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
